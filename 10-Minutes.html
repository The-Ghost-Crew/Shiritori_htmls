<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just 10 Minutes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --shell: #232323;
    --shell-dark: #161616;
    --shell-edge: #3a3a3a;
    --screen: #c7d6a3;
    --screen-dark: #33421c;
    --red: #e4572e;
    --red-dark: #b5411e;
    --paper: #f3f0e8;
    --led: #7ee08a;
    --led-hot: #ff6b57;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #3a3a3a, #121212 70%);
    font-family: 'Space Grotesk', sans-serif;
    padding: 32px 16px;
    overflow: hidden;
  }

  .console {
    width: 340px;
    background: linear-gradient(160deg, var(--shell), var(--shell-dark));
    border-radius: 28px;
    padding: 24px 22px 32px;
    box-shadow:
      0 30px 60px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 0 -2px 0 rgba(0,0,0,0.4);
    border: 1px solid var(--shell-edge);
    position: relative;
    transition: transform 0.55s cubic-bezier(.2,.8,.2,1);
    z-index: 1;
  }

  .console::before {
    content: "";
    position: absolute;
    top: 14px; right: 22px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--led);
    box-shadow: 0 0 8px 2px var(--led);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }

  .console.running::before {
    background: var(--led-hot);
    box-shadow: 0 0 10px 3px var(--led-hot);
  }

  .console.running {
    transform: scale(1.22);
  }

  @keyframes shake {
    0%, 100% { transform: scale(1.22) translateX(0); }
    15% { transform: scale(1.22) translateX(-9px) rotate(-1deg); }
    30% { transform: scale(1.22) translateX(8px) rotate(1deg); }
    45% { transform: scale(1.22) translateX(-7px) rotate(-1deg); }
    60% { transform: scale(1.22) translateX(7px) rotate(1deg); }
    75% { transform: scale(1.22) translateX(-4px); }
    90% { transform: scale(1.22) translateX(4px); }
  }

  .console.shake {
    animation: shake 0.6s ease;
  }

  .fade-part {
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }

  .console.running .fade-part {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .brand-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 4px 14px;
  }

  .brand {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: #9a9a9a;
    text-transform: uppercase;
  }

  .brand strong { color: #eaeaea; }

  .screen {
    background: var(--screen);
    border-radius: 10px;
    padding: 22px 16px 26px;
    box-shadow:
      inset 0 3px 10px rgba(0,0,0,0.35),
      inset 0 0 0 6px #263314;
    position: relative;
    overflow: hidden;
  }

  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(51,66,28,0.06) 0px,
      rgba(51,66,28,0.06) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
  }

  .eyebrow {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--screen-dark);
    letter-spacing: 0.05em;
    text-align: center;
    opacity: 0.75;
  }

  .title {
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    color: var(--screen-dark);
    text-align: center;
    line-height: 1.6;
    margin: 10px 0 18px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.15);
  }

  .timer {
    font-family: 'Press Start 2P', monospace;
    font-size: 40px;
    color: var(--screen-dark);
    text-align: center;
    letter-spacing: 1px;
    text-shadow: 0 2px 0 rgba(255,255,255,0.12);
    margin-bottom: 6px;
    white-space: nowrap;
  }

  .timer-label {
    font-size: 10px;
    text-align: center;
    color: var(--screen-dark);
    opacity: 0.65;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .controls {
    padding: 26px 6px 4px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .start-btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(180deg, var(--red), var(--red-dark));
    color: var(--paper);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.03em;
    cursor: pointer;
    box-shadow:
      0 4px 0 #7c2a12,
      0 8px 16px rgba(228,87,46,0.35);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .start-btn:active {
    transform: translateY(4px);
    box-shadow:
      0 0 0 #7c2a12,
      0 4px 10px rgba(228,87,46,0.3);
  }

  .start-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .ghost-btn {
    width: 100%;
    padding: 13px 8px;
    border-radius: 12px;
    border: 1.5px solid #4a4a4a;
    background: #2c2c2c;
    color: #cfcfcf;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .ghost-btn:hover {
    background: #363636;
    border-color: #666;
  }

  .ghost-btn svg { flex-shrink: 0; }

  .footer-note {
    text-align: center;
    font-size: 10px;
    color: #6b6b6b;
    margin-top: 18px;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

  <div class="console" id="console">
    <div class="brand-row fade-part">
      <span class="brand"><strong>JUST</strong> 10 MINUTES</span>
      <span class="brand">V0.1</span>
    </div>

    <div class="screen">
      <div class="eyebrow">FOCUS SESSION</div>
      <div class="title">JUST<br>10 MINUTES</div>
      <div class="timer-label" id="timerLabel">Ready to begin</div>
      <div class="timer" id="timerDisplay">10:00</div>
    </div>

    <div class="controls fade-part">
      <button class="start-btn" id="startBtn" type="button">START 10 MINUTE TIMER</button>
      <button class="ghost-btn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
          <path d="M2 17l10 5 10-5"></path>
          <path d="M2 12l10 5 10-5"></path>
        </svg>
        Effects Catalog
      </button>
    </div>

    <div class="footer-note fade-part">TAP START TO BEGIN</div>
  </div>

  <script>
    const consoleEl = document.getElementById('console');
    const startBtn = document.getElementById('startBtn');
    const timerDisplay = document.getElementById('timerDisplay');
    const timerLabel = document.getElementById('timerLabel');

    const TOTAL_SECONDS = 600;
    let remaining = TOTAL_SECONDS;
    let intervalId = null;

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function startTimer() {
      if (intervalId) return;
      startBtn.disabled = true;
      consoleEl.classList.add('running');
      timerLabel.textContent = 'In progress';

      intervalId = setInterval(() => {
        remaining -= 1;
        timerDisplay.textContent = formatTime(remaining);

        if (remaining <= 0) {
          clearInterval(intervalId);
          intervalId = null;
          endTimer();
        }
      }, 1000);
    }

    function endTimer() {
      timerLabel.textContent = "Time's up";
      consoleEl.classList.add('shake');

      consoleEl.addEventListener('animationend', function handler() {
        consoleEl.removeEventListener('animationend', handler);
        consoleEl.classList.remove('shake');
        consoleEl.classList.remove('running');
        remaining = TOTAL_SECONDS;
        timerDisplay.textContent = formatTime(remaining);
        timerLabel.textContent = 'Ready to begin';
        startBtn.disabled = false;
      });
    }

    startBtn.addEventListener('click', startTimer);
  </script>

</body>
</html>
